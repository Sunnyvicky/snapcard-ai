name: Build SnapCard iPhone icon
on:
  push:
    paths:
      - 'icon.svg'
      - '.github/workflows/build-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render iPhone icon
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              cairosvg.svg2png(url='icon.svg',write_to=name,output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate SnapCard iOS PNG icons"
            git push
          fi
